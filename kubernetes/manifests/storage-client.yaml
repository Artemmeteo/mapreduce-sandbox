apiVersion: v1
kind: Pod
metadata:
  name: rustfs-client
  namespace: de-k8s-lab
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 600
  automountServiceAccountToken: false
  containers:
    - name: client
      image: mapreduce-lab:k8s
      imagePullPolicy: Never
      command: [sleep, "600"]
      env:
        - name: S3_ENDPOINT
          value: http://rustfs.de-k8s-lab.svc.cluster.local:9000
      envFrom:
        - secretRef:
            name: rustfs-external
      resources:
        requests: {cpu: 100m, memory: 48Mi}
        limits: {cpu: "1", memory: 192Mi}
