apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: de-k8s-lab
spec:
  storageClassName: standard
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: de-k8s-lab
spec:
  selector: {app: rustfs}
  ports: [{name: s3, port: 9000, targetPort: 9000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: de-k8s-lab
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: rustfs}
  template:
    metadata:
      labels: {app: rustfs}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: rustfs-data}
        - name: logs
          emptyDir: {}
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0@sha256:42edb61d588775f9431ff436216d14392d2234d4eb2ed68321569fbf7245b36b
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: logs, mountPath: /logs}
          env:
            - {name: RUSTFS_VOLUMES, value: "/data/vol1 /data/vol2 /data/vol3 /data/vol4"}
            - {name: RUSTFS_ERASURE_SET_DRIVE_COUNT, value: "4"}
            - {name: RUSTFS_STORAGE_CLASS_STANDARD, value: "EC:2"}
            - {name: RUSTFS_UNSAFE_BYPASS_DISK_CHECK, value: "true"}
            - {name: RUSTFS_OBS_LOG_DIRECTORY, value: "/logs"}
            - {name: RUSTFS_ACCESS_KEY, valueFrom: {secretKeyRef: {name: rustfs-external, key: S3_ACCESS_KEY}}}
            - {name: RUSTFS_SECRET_KEY, valueFrom: {secretKeyRef: {name: rustfs-external, key: S3_SECRET_KEY}}}
          readinessProbe:
            httpGet: {path: /health, port: 9000}
            periodSeconds: 2
