name: hw3-java-lab

services:
  rustfs:
    # Official release 1.0.0, pinned to its linux/arm64 manifest for Apple Silicon.
    image: rustfs/rustfs:1.0.0@sha256:42edb61d588775f9431ff436216d14392d2234d4eb2ed68321569fbf7245b36b
    platform: linux/arm64
    # Match the macOS owner of the bind mounts; /data and /logs are both mounted.
    user: "${LOCAL_UID:?LOCAL_UID is required}:${LOCAL_GID:?LOCAL_GID is required}"
    restart: "no"
    environment:
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      RUSTFS_VOLUMES: "/data/vol1 /data/vol2 /data/vol3 /data/vol4"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      # Educational setup: all four folders share the same physical SSD.
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
      RUSTFS_ERASURE_SET_DRIVE_COUNT: "4"
      RUSTFS_STORAGE_CLASS_STANDARD: "EC:2"
      RUSTFS_OBS_LOGGER_LEVEL: "info"
      RUSTFS_OBS_LOG_DIRECTORY: "/logs"
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - type: bind
        source: ../storage
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ../logs
        target: /logs
        bind:
          create_host_path: false

  s3cli:
    # On-demand client: docker compose run --rm s3cli <AWS CLI arguments>.
    image: amazon/aws-cli:2.36.45@sha256:f0c630a58b0e5772a58153cd989f34b905371d78bcdc45fdfdd5e212aec996c6
    platform: linux/arm64
    profiles: [tools]
    user: "${LOCAL_UID:?LOCAL_UID is required}:${LOCAL_GID:?LOCAL_GID is required}"
    environment:
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_ENDPOINT_URL: "http://rustfs:9000"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    command: ["--version"]
    volumes:
      - type: bind
        source: ../it_vacancies_2024.csv
        target: /input/it_vacancies_2024.csv
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../downloads
        target: /downloads
        bind:
          create_host_path: false
